<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wajir County, Kenya: scrolling map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

<style>
  :root {
    /* emLab color system (primary palette) */
    --ink: #1f2d3a;          /* body text (neutral dark) */
    --heading: #044E95;      /* emLab dark blue */
    --panel: #ffffff;        /* text card background */
    --rule: #9CBEBE;         /* card edge (emLab secondary sea glass) */
    --region: #044E95;       /* Wajir fill + outline (emLab dark blue) */
    --route: #63A644;        /* lines and points (emLab green) */
    --active: #FFA509;       /* active card marker (emLab orange) */
    --hotspot: #FFA509;      /* migration destination (emLab orange) */
    --font: "Literata", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); color: var(--ink); background: #eef3f5; }

  #map { position: fixed; inset: 0; z-index: 0; }

  #story { position: relative; z-index: 1; pointer-events: none; }
  .step { min-height: 100vh; display: flex; align-items: center; padding: 0 5vw; }
  .step:last-child { min-height: 120vh; }
  .card {
    pointer-events: auto;
    max-width: 25rem;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-left: 4px solid var(--rule);
    padding: 1.25rem 1.5rem;
    line-height: 1.6;
    font-size: 1.05rem;
    opacity: .55;
    transition: opacity .4s ease, border-color .4s ease;
  }
  .step.is-active .card { opacity: 1; border-left-color: var(--active); }
  .card h2 { font-size: 1.3rem; font-weight: 600; line-height: 1.25; margin: 0 0 .5rem; color: var(--heading); }
  .card p { margin: 0; }

  @media (max-width: 640px) {
    .step { align-items: flex-end; padding: 0 1rem 12vh; }
    .card { max-width: none; font-size: 1rem; }
  }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  .maplibregl-ctrl-attrib { font-family: system-ui, sans-serif; }

  /* Landmark icons (Nairobi skyline, wildlife parks) */
  .landmark { position: relative; pointer-events: none; opacity: 0; transition: opacity .6s ease; }
  .landmark.on { opacity: 1; }
  .landmark .badge { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
                     background: #fff; border: 2.5px solid currentColor; box-shadow: 0 1px 3px rgba(4,78,149,.25); }
  .landmark.city { color: var(--heading); }
  .landmark.park { color: var(--route); }
  .landmark.park .badge { width: 34px; height: 38px; border: 0; border-radius: 0; background: none; box-shadow: none;
                          filter: drop-shadow(0 1px 2px rgba(4,78,149,.25)); }
  .landmark.park svg { width: 100%; height: 100%; }
  .landmark svg { width: 70%; height: 70%; fill: currentColor; }
  .landmark .name { position: absolute; font: 600 12px/1.2 system-ui, sans-serif; color: var(--ink);
                    background: rgba(255,255,255,.85); padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
  .name.left  { right: 100%; top: 50%; transform: translateY(-50%); margin-right: 4px; }
  .name.right { left: 100%; top: 50%; transform: translateY(-50%); margin-left: 4px; }
  .name.below { top: 100%; left: 50%; transform: translateX(-50%); margin-top: 3px; }
  .landmark .name { text-align: center; }
  .name.left { text-align: right; }
  .name.right { text-align: left; }
  .name .kind { display: block; font-weight: 400; font-size: 11px; }
  @media (prefers-reduced-motion: reduce) { .landmark { transition: none; } }
</style>
</head>

// Smooth curved route from a to b, bending toward ctrl
function curve(a, b, ctrl, n = 80) {
  const pts = [];
  for (let k = 0; k <= n; k++) {
    const u = k / n, v = 1 - u;
    pts.push([v * v * a[0] + 2 * v * u * ctrl[0] + u * u * b[0],
              v * v * a[1] + 2 * v * u * ctrl[1] + u * u * b[1]]);
  }
  return pts;
}

    layout: { "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"], "text-size": 14,
              "text-offset": [0, 1.1], "text-anchor": "top" },
    paint: { "text-color": INK_COLOR, "text-halo-color": "#fff", "text-halo-width": 1.5,
             "text-opacity": 0, "text-opacity-transition": FADE } });

  addLandmarks();
  setupScroll();
});

const ICONS = {
  // Skyline: towers of different heights on a ground line
  city: '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="17" width="5" height="11"/><rect x="9" y="9" width="5" height="19"/><rect x="10.5" y="5" width="2" height="4"/><rect x="15" y="13" width="6" height="15"/><rect x="22" y="4" width="4" height="24"/><rect x="23.5" y="1.5" width="1" height="2.5"/><rect x="27" y="15" width="3" height="13"/><rect x="2" y="28" width="28" height="2"/></svg>',
  // Protected-area badge: shield with a flat-topped acacia
  park: '<svg viewBox="0 0 32 36" aria-hidden="true"><path d="M16 1.5 L29 5.5 V17 C29 26 23 31.5 16 34.5 C9 31.5 3 26 3 17 V5.5 Z" fill="#fff" stroke="currentColor" stroke-width="2.2"/><path d="M6.5 13.2 Q8.5 9.6 12.8 10.2 Q16 8 19.2 10.2 Q23.5 9.6 25.5 13.2 Q21 15 16 14.4 Q11 15 6.5 13.2 Z"/><path d="M15.1 14 H16.9 L17.4 25.2 H14.6 Z"/><path d="M15.6 19.5 L11 14.2 L12.2 13.8 L16.3 18.4 Z"/><path d="M16.4 18.6 L20.6 14 L21.6 14.6 L16.8 19.9 Z"/><rect x="7.5" y="25" width="17" height="1.8" rx=".9"/></svg>'
};
const landmarkEls = [];
function addLandmarks() {
  LANDMARKS.forEach(l => {
    const wrap = document.createElement("div"); // MapLibre positions this outer element
    const el = document.createElement("div");
    el.className = `landmark ${l.kind}`;
    wrap.appendChild(el);
    el.innerHTML = `<div class="badge">${ICONS[l.kind]}</div>`;
    if (l.label !== "none") {
      const name = document.createElement("div");
      name.className = `name ${l.label}`;
      name.textContent = l.name;
      if (l.designation) {
        const kind = document.createElement("span");
        kind.className = "kind";
        kind.textContent = l.designation;
        name.appendChild(kind);
      }
      el.appendChild(name);
    }
    // The skyline sits just below Nairobi so the basemap's city label stays readable
    const opts = l.kind === "city" ? { anchor: "top", offset: [0, 4] } : { anchor: "center" };
    new maplibregl.Marker({ element: wrap, ...opts }).setLngLat(l.coord).addTo(map);
    landmarkEls.push(el);
  });
}

let current = -1;
function goTo(i) {
  if (i === current) return;
  current = i;
  const s = STEPS[i];
  document.querySelectorAll(".step").forEach(el =>
    el.classList.toggle("is-active", Number(el.dataset.index) === i));
  for (const [group, layers] of Object.entries(GROUPS)) {
    const on = s.show.includes(group);
    layers.forEach(([id, prop, value]) => map.setPaintProperty(id, prop, on ? value : 0));
    if (group === "places") map.setPaintProperty("places-dot", "circle-stroke-opacity", on ? 1 : 0);
  }
  landmarkEls.forEach(el => el.classList.toggle("on", s.show.includes("landmarks")));
  s.show.includes("migration") ? startMigration() : stopMigration();
  if (reduceMotion) map.jumpTo({ center: s.center, zoom: s.zoom });
  else map.flyTo({ center: s.center, zoom: s.zoom, speed: 0.8, curve: 1.4, essential: true });
}

// Animation for the migration step; skipped for readers who prefer reduced motion
let raf = null;
function startMigration() {
  if (reduceMotion || raf) return;
  const t0 = performance.now();
  const tick = now => {
    const t = (now - t0) / 1000;
    const shift = (t * 0.08) % 0.2;                       // dots march toward Mozambique
    map.getSource("herd").setData(pointsAt([0, 0.2, 0.4, 0.6, 0.8].map(f => (f + shift + 0.02) % 1)));
    const pulse = (t % 1.8) / 1.8;                        // ring expands and fades
    map.setPaintProperty("hotspot-pulse", "circle-radius", 8 + pulse * 26);
    map.setPaintProperty("hotspot-pulse", "circle-stroke-opacity", 0.9 * (1 - pulse));
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
function stopMigration() {
  if (raf) cancelAnimationFrame(raf);
  raf = null;
  if (map.getLayer("hotspot-pulse")) map.setPaintProperty("hotspot-pulse", "circle-stroke-opacity", 0);
}

function setupScroll() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) goTo(Number(e.target.dataset.index)); });
  }, { rootMargin: "-50% 0px -50% 0px" });
  document.querySelectorAll(".step").forEach(el => observer.observe(el));
  goTo(0);
}
</script>
</body>
</html>
